<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#123d26">
  <meta name="description" content="Skat mit deutschem Blatt gegen faire Computergegner. Ohne Werbung, ohne Konto, offline spielbar.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Skat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu" class="tb" type="button">☰ Menü</button>
      <div id="status" aria-live="polite"></div>
      <button id="btn-last" class="tb" type="button">Letzter Stich</button>
      <button id="btn-sound" class="tb" type="button">Ton an</button>
    </header>
    <section id="seat-1" class="seat left"></section>
    <section id="seat-2" class="seat right"></section>
    <div id="ouvert"></div>
    <div id="table">
      <div id="trick"></div>
      <div id="panel"></div>
    </div>
    <div id="me-label"></div>
    <div id="hand"></div>
  </div>
  <div id="rotate">
    <div class="rotate-box">
      <div class="rotate-phone"></div>
      <p>Bitte das Handy quer halten.</p>
    </div>
  </div>
  <div id="modal" hidden></div>
  <noscript>Für Skat muss JavaScript eingeschaltet sein.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
